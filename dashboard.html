<body class="min-h-screen text-white bg-[#050505]">

    <!-- HEADER placeholder -->

    <div class="flex min-h-[calc(100vh-64px)]">

                <div id="section-overview" class="dash-section"></div>
                <div id="section-searches" class="dash-section hidden"></div>

                <div id="section-messages" class="dash-section hidden"></div>
                <div id="section-guide" class="dash-section hidden"></div>

    <script>
        // ── Auth check ──
        let _user = null;
        let _userData = null;

        async function initDashboard() {
            try {
                const res = await fetch('/api/me');
                const data = await res.json();
                if (data.ok) {
                    _user = data.user;
                } else {
                    throw new Error('not auth');
                }
            } catch {
                // Fallback: check localStorage
                const stored = localStorage.getItem('mosnauka_user');
                if (stored) {
                    _user = JSON.parse(stored);
                } else {
                    window.location.href = 'login.html';
                    return;
                }
            }

            // Load user data
            try {
                const res2 = await fetch('/api/user-data');
                const d2 = await res2.json();
                if (d2.ok) _userData = d2;
            } catch {
                // Fallback demo data
                _userData = {
                  searches: [
                    { query: 'Литий-ионные аккумуляторы', date: '12 мар 2026', results: 18 },
                    { query: 'Наноматериалы для катализа', date: '10 мар 2026', results: 24 },
                    { query: 'Компьютерное зрение для промышленности', date: '7 мар 2026', results: 11 },
                  ],
                  projects: [
                    // Подбор — разные темы
                    { title: 'Катализаторы нового поколения для нефтепереработки', stage: 'search', executor: '', budget: '8 млн ₽', deadline: 'Q3 2026' },

                      id: 'mfti-center',
                      type: 'center',

                        { from: 'business', text: 'Нам нужно повысить ёмкость батарей для наших промышленных устройств на 20-30%. Текущие поставщики катодов не дают нужную плотность энергии.', date: '2026-03-14T09:00:00' },

                    { type: 'scientist', name: 'Сорокин П.Б.', page: 'mfti/sci_005.html' },
                  ]

            }

            // Render components (filled in by next chunks)
            if (typeof renderHeader === 'function') renderHeader();
            if (typeof renderSidebar === 'function') renderSidebar();
            if (typeof renderOverview === 'function') renderOverview();

            // Backward compat: flatten conversations into messages for old code
            if (_userData.conversations && !_userData.messages) {
                _userData.messages = _userData.conversations[0]?.messages || [];
            }
        }

        // ── Render Header ──
        function renderHeader() {
            document.getElementById('dash-header').innerHTML = `
                <div class="sticky top-0 z-30 backdrop-blur border-b border-white/10 bg-black/60">
                    <div class="flex items-center justify-between px-6 py-3">

                            <div class="hidden md:block h-5 w-px bg-white/10"></div>

                            </div>

                            <i class="ph ${s.icon} text-${s.color}-400 text-xl"></i>
                            <span class="text-2xl font-black italic text-${s.color}-400">${count}</span>
                        </div>
                        <div class="text-xs font-bold uppercase tracking-wider text-gray-500 group-hover:text-gray-300 transition">${s.label}</div>

                            <div class="text-[10px] text-gray-500">Расходы НИОКР</div>
                        </div>
                        <div class="p-3 rounded-xl bg-white/[0.03] border border-white/[0.06] text-center">

            if (typeof window[renderFn] === 'function') window[renderFn]();
        }

        function doLogout() {
            fetch('/api/logout', { method: 'POST' }).catch(() => {});
            localStorage.removeItem('mosnauka_user');
            window.location.href = 'login.html';
        }

        initDashboard();
    </script>
