<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>МОСНАУКА — Личный кабинет</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/regular/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        body { font-family: Inter, system-ui, sans-serif; background: #050505; }
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); }
        .mos-red { color: #FF003C; }
        .mos-bg-red { background: #FF003C; }
    </style>
</head>
<body class="min-h-screen text-white bg-[#050505]">

    <!-- HEADER placeholder -->
    <header id="dash-header"></header>

    <div class="flex min-h-[calc(100vh-64px)]">
        <!-- SIDEBAR placeholder -->
        <aside id="dash-sidebar" class="w-64 shrink-0 hidden md:block"></aside>

        <!-- MAIN CONTENT -->
        <main id="dash-main" class="flex-1 p-6 md:p-8 overflow-y-auto">
            <div class="max-w-5xl mx-auto">
                <!-- Sections will be inserted here by subsequent chunks -->
                <div id="section-overview" class="dash-section"></div>
                <div id="section-searches" class="dash-section hidden"></div>
                <div id="section-projects" class="dash-section hidden"></div>
                <div id="section-messages" class="dash-section hidden"></div>
                <div id="section-guide" class="dash-section hidden"></div>
                <div id="section-profile" class="dash-section hidden"></div>
            </div>
        </main>
    </div>

    <script>
        // ── Auth check ──
        let _user = null;
        let _userData = null;

        async function initDashboard() {
            try {
                const res = await fetch('/api/me');
                const data = await res.json();
                if (data.ok) {
                    _user = data.user;
                } else {
                    throw new Error('not auth');
                }
            } catch {
                // Fallback: check localStorage
                const stored = localStorage.getItem('mosnauka_user');
                if (stored) {
                    _user = JSON.parse(stored);
                } else {
                    window.location.href = 'login.html';
                    return;
                }
            }

            // Load user data
            try {
                const res2 = await fetch('/api/user-data');
                const d2 = await res2.json();
                if (d2.ok) _userData = d2;
            } catch {
                // Fallback demo data
                _userData = { searches: [], projects: [], messages: [], favorites: [] };
            }

            // Render components (filled in by next chunks)
            if (typeof renderHeader === 'function') renderHeader();
            if (typeof renderSidebar === 'function') renderSidebar();
            if (typeof renderOverview === 'function') renderOverview();
        }

        // ── Render Header ──
        function renderHeader() {
            document.getElementById('dash-header').innerHTML = `
                <div class="sticky top-0 z-30 backdrop-blur border-b border-white/10 bg-black/60">
                    <div class="flex items-center justify-between px-6 py-3">
                        <div class="flex items-center gap-4">
                            <a href="index_v2.html" class="text-xl font-black italic tracking-tight uppercase">
                                МОС<span class="mos-red">НАУКА</span>
                            </a>
                            <div class="hidden md:block h-5 w-px bg-white/10"></div>
                            <span class="hidden md:block text-[10px] uppercase tracking-[0.2em] text-zinc-500 font-bold">Личный кабинет</span>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-white/5 border border-white/10">
                                <i class="ph ph-buildings text-red-400 text-sm"></i>
                                <span class="text-xs font-bold text-gray-300">${_user?.company || 'Компания'}</span>
                            </div>
                            <button onclick="doLogout()" class="px-3 py-1.5 rounded-lg border border-white/10 text-[10px] font-bold uppercase tracking-wider text-gray-500 hover:text-white hover:bg-white/10 transition">
                                <i class="ph ph-sign-out"></i> Выйти
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // ── Render Overview ──
        function renderOverview() {
            const projects = _userData?.projects || [];
            const stages = [
                { id: 'search',      label: 'Подбор',       icon: 'ph-magnifying-glass', color: 'red' },
                { id: 'negotiation', label: 'Переговоры',   icon: 'ph-handshake',        color: 'amber' },
                { id: 'contract',    label: 'Договор',      icon: 'ph-file-text',        color: 'blue' },
                { id: 'execution',   label: 'Выполнение',   icon: 'ph-gear',             color: 'emerald' },
                { id: 'closed',      label: 'Закрыто',      icon: 'ph-check-circle',     color: 'gray' },
            ];

            const cards = stages.map(s => {
                const count = projects.filter(p => p.stage === s.id).length;
                return `
                    <div class="p-4 rounded-2xl bg-white/[0.03] border border-white/[0.06] hover:border-${s.color}-500/30 transition cursor-pointer group"
                         onclick="switchSection('projects')">
                        <div class="flex items-center justify-between mb-3">
                            <i class="ph ${s.icon} text-${s.color}-400 text-xl"></i>
                            <span class="text-2xl font-black italic text-${s.color}-400">${count}</span>
                        </div>
                        <div class="text-xs font-bold uppercase tracking-wider text-gray-500 group-hover:text-gray-300 transition">${s.label}</div>
                    </div>
                `;
            }).join('');

            document.getElementById('section-overview').innerHTML = `
                <div class="mb-8">
                    <div class="text-[10px] uppercase tracking-[0.2em] text-red-400 font-bold mb-2">Дашборд</div>
                    <h1 class="text-3xl md:text-4xl font-black italic tracking-tight">Добро пожаловать</h1>
                    <p class="text-gray-500 mt-1">${_user?.company || ''} · ${_user?.industry || ''}</p>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-8">${cards}</div>
                <div>
                    <div class="text-[10px] uppercase tracking-[0.2em] text-zinc-600 font-black mb-4">Последние события</div>
                    <div class="space-y-2">
                        <div class="p-4 rounded-xl bg-white/[0.03] border border-white/[0.06] flex items-start gap-3 hover:bg-white/[0.05] transition cursor-pointer" onclick="switchSection('messages')">
                            <div class="w-8 h-8 rounded-lg bg-emerald-500/15 flex items-center justify-center shrink-0"><i class="ph ph-chat-circle text-emerald-400"></i></div>
                            <div class="flex-1 min-w-0">
                                <div class="text-sm font-bold">Новый ответ от МФТИ</div>
                                <p class="text-xs text-gray-500 mt-0.5 truncate">«Готов назначить встречу для обсуждения ТЗ...»</p>
                            </div>
                            <span class="text-[10px] text-gray-600 shrink-0">2ч назад</span>
                        </div>
                        <div class="p-4 rounded-xl bg-white/[0.03] border border-white/[0.06] flex items-start gap-3 hover:bg-white/[0.05] transition cursor-pointer" onclick="switchSection('projects')">
                            <div class="w-8 h-8 rounded-lg bg-amber-500/15 flex items-center justify-center shrink-0"><i class="ph ph-arrow-right text-amber-400"></i></div>
                            <div class="flex-1 min-w-0">
                                <div class="text-sm font-bold">Проект перешёл в «Переговоры»</div>
                                <p class="text-xs text-gray-500 mt-0.5 truncate">Система машинного зрения — МФТИ</p>
                            </div>
                            <span class="text-[10px] text-gray-600 shrink-0">вчера</span>
                        </div>
                        <div class="p-4 rounded-xl bg-white/[0.03] border border-white/[0.06] flex items-start gap-3 hover:bg-white/[0.05] transition cursor-pointer" onclick="switchSection('guide')">
                            <div class="w-8 h-8 rounded-lg bg-blue-500/15 flex items-center justify-center shrink-0"><i class="ph ph-receipt text-blue-400"></i></div>
                            <div class="flex-1 min-w-0">
                                <div class="text-sm font-bold">Напоминание: налоговый вычет ×2</div>
                                <p class="text-xs text-gray-500 mt-0.5 truncate">Оформите НИОКР по ст. 262 НК до конца квартала</p>
                            </div>
                            <span class="text-[10px] text-gray-600 shrink-0">3 дня</span>
                        </div>
                        <div class="p-4 rounded-xl bg-white/[0.03] border border-white/[0.06] flex items-start gap-3 hover:bg-white/[0.05] transition cursor-pointer" onclick="switchSection('searches')">
                            <div class="w-8 h-8 rounded-lg bg-purple-500/15 flex items-center justify-center shrink-0"><i class="ph ph-magnifying-glass text-purple-400"></i></div>
                            <div class="flex-1 min-w-0">
                                <div class="text-sm font-bold">Найдено 18 проектов</div>
                                <p class="text-xs text-gray-500 mt-0.5 truncate">По запросу «Литий-ионные аккумуляторы»</p>
                            </div>
                            <span class="text-[10px] text-gray-600 shrink-0">5 дней</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // ── Render Searches ──
        function renderSearches() {
            const searches = _userData?.searches || [];
            const rows = searches.length ? searches.map(s => `
                <div class="p-4 rounded-xl bg-white/[0.03] border border-white/[0.06] flex items-center justify-between hover:bg-white/[0.05] transition">
                    <div class="flex items-center gap-3 min-w-0">
                        <i class="ph ph-magnifying-glass text-gray-500"></i>
                        <div class="min-w-0">
                            <div class="text-sm font-semibold truncate">${s.query}</div>
                            <div class="text-[10px] text-gray-600">${s.date} · ${s.results} результатов</div>
                        </div>
                    </div>
                    <a href="ai_search_results.html?q=${encodeURIComponent(s.query)}" class="px-3 py-1.5 rounded-lg mos-bg-red text-[10px] font-bold uppercase tracking-wider hover:opacity-90 transition shrink-0">Повторить</a>
                </div>
            `).join('') : '<p class="text-gray-500 text-sm py-8 text-center">Нет сохранённых поисков</p>';

            document.getElementById('section-searches').innerHTML = `
                <div class="mb-6">
                    <div class="text-[10px] uppercase tracking-[0.2em] text-red-400 font-bold mb-2">История</div>
                    <h2 class="text-2xl font-black italic tracking-tight">Мои поиски</h2>
                </div>
                <div class="space-y-2">${rows}</div>
                <div class="mt-6 text-center">
                    <a href="index_v2.html" class="inline-flex items-center gap-2 px-6 py-3 rounded-xl border border-white/10 text-xs font-bold uppercase tracking-wider hover:bg-white/5 transition">
                        <i class="ph ph-magnifying-glass"></i> Новый поиск
                    </a>
                </div>
            `;
        }

        // ── Render Projects (Kanban) ──
        function renderProjects() {
            const projects = _userData?.projects || [];
            const stages = [
                { id: 'search',      label: 'Подбор',     color: 'red' },
                { id: 'negotiation', label: 'Переговоры', color: 'amber' },
                { id: 'contract',    label: 'Договор',    color: 'blue' },
                { id: 'execution',   label: 'Выполнение', color: 'emerald' },
                { id: 'closed',      label: 'Закрыто',    color: 'gray' },
            ];

            const columns = stages.map(s => {
                const stageProjects = projects.filter(p => p.stage === s.id);
                const cards = stageProjects.map(p => `
                    <div class="p-3 rounded-xl bg-white/[0.03] border border-white/[0.06] hover:border-${s.color}-500/20 transition">
                        <div class="text-xs font-bold mb-2 line-clamp-2">${p.title}</div>
                        ${p.executor ? `<div class="flex items-center gap-1.5 mb-2"><i class="ph ph-buildings text-${s.color}-400 text-xs"></i><span class="text-[10px] text-gray-400">${p.executor}</span></div>` : '<div class="text-[10px] text-gray-600 mb-2 italic">Исполнитель не выбран</div>'}
                        <div class="flex items-center justify-between">
                            <span class="text-[9px] text-gray-600">${p.budget || ''}</span>
                            <span class="text-[9px] text-gray-600">${p.deadline || ''}</span>
                        </div>
                    </div>
                `).join('');

                return `
                    <div class="min-w-[200px]">
                        <div class="flex items-center gap-2 mb-3">
                            <div class="w-2 h-2 rounded-full bg-${s.color}-400"></div>
                            <span class="text-[10px] uppercase tracking-wider font-bold text-gray-500">${s.label}</span>
                            <span class="text-[10px] text-gray-600">${stageProjects.length}</span>
                        </div>
                        <div class="space-y-2">${cards || '<div class="p-4 rounded-xl border border-dashed border-white/10 text-center text-[10px] text-gray-700">Пусто</div>'}</div>
                    </div>
                `;
            }).join('');

            document.getElementById('section-projects').innerHTML = `
                <div class="mb-6">
                    <div class="text-[10px] uppercase tracking-[0.2em] text-red-400 font-bold mb-2">НИОКР Pipeline</div>
                    <h2 class="text-2xl font-black italic tracking-tight">Проекты</h2>
                </div>
                <div class="flex gap-4 overflow-x-auto pb-4">${columns}</div>
            `;
        }

        // ── Render Messages ──
        function renderMessages() {
            const messages = _userData?.messages || [];
            const bubbles = messages.map(m => {
                const isMine = m.from === 'business';
                return `
                    <div class="flex ${isMine ? 'justify-end' : 'justify-start'}">
                        <div class="max-w-[75%] p-3 rounded-2xl ${isMine
                            ? 'bg-red-600/20 border border-red-500/20 rounded-br-md'
                            : 'bg-white/[0.05] border border-white/[0.08] rounded-bl-md'}">
                            <div class="text-[10px] font-bold mb-1 ${isMine ? 'text-red-400' : 'text-blue-400'}">${isMine ? _user?.company || 'Вы' : 'МФТИ'}</div>
                            <p class="text-sm text-gray-200">${m.text}</p>
                            <div class="text-[9px] text-gray-600 mt-1 text-right">${new Date(m.date).toLocaleString('ru')}</div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('section-messages').innerHTML = `
                <div class="mb-6">
                    <div class="text-[10px] uppercase tracking-[0.2em] text-red-400 font-bold mb-2">Коммуникация</div>
                    <h2 class="text-2xl font-black italic tracking-tight">Сообщения</h2>
                </div>
                <div class="rounded-2xl border border-white/[0.06] bg-white/[0.02] p-4">
                    <div class="flex items-center gap-3 pb-4 border-b border-white/5 mb-4">
                        <div class="w-8 h-8 rounded-lg bg-blue-500/15 flex items-center justify-center"><i class="ph ph-buildings text-blue-400"></i></div>
                        <div>
                            <div class="text-sm font-bold">МФТИ</div>
                            <div class="text-[10px] text-gray-500">Лаб. автономных систем</div>
                        </div>
                    </div>
                    <div class="space-y-3 max-h-[400px] overflow-y-auto mb-4">${bubbles}</div>
                    <div class="flex gap-2">
                        <input type="text" placeholder="Написать сообщение..." class="flex-1 px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-sm text-white placeholder-gray-600 focus:border-red-500/50 focus:outline-none transition" />
                        <button class="px-4 py-3 rounded-xl mos-bg-red text-xs font-bold uppercase tracking-wider hover:opacity-90 transition"><i class="ph ph-paper-plane-tilt"></i></button>
                    </div>
                </div>
            `;
        }

        // ── Render Guide ──
        function renderGuide() {
            document.getElementById('section-guide').innerHTML = `
                <div class="mb-6">
                    <div class="text-[10px] uppercase tracking-[0.2em] text-red-400 font-bold mb-2">Методичка</div>
                    <h2 class="text-2xl font-black italic tracking-tight">НИОКР-гид</h2>
                </div>
                <div class="space-y-4">
                    <!-- Tax benefit -->
                    <div class="rounded-2xl border border-white/[0.06] bg-white/[0.02] p-5">
                        <div class="flex items-center gap-3 mb-4">
                            <div class="w-10 h-10 rounded-xl bg-emerald-500/15 flex items-center justify-center"><i class="ph ph-calculator text-emerald-400 text-xl"></i></div>
                            <div>
                                <div class="text-lg font-black">Налоговый вычет ×2</div>
                                <div class="text-[10px] text-gray-500">ст. 262 НК РФ, п. 7</div>
                            </div>
                        </div>
                        <div class="space-y-2 text-sm text-gray-300">
                            <p>Расходы на НИОКР можно учесть с <span class="text-emerald-400 font-bold">повышающим коэффициентом ×2</span> при расчёте налога на прибыль (ст. 262 НК РФ). Ставка для Москвы — <span class="text-emerald-400 font-bold">25%</span> (8% фед. + 17% рег.), экономия до <span class="text-emerald-400 font-bold">5 млн ₽ на 10 млн ₽</span> затрат.</p>
                            <div class="mt-3 p-3 rounded-xl bg-emerald-500/5 border border-emerald-500/10">
                                <div class="text-[10px] uppercase tracking-wider font-bold text-emerald-400 mb-2">Пошагово:</div>
                                <ol class="list-decimal list-inside space-y-1 text-xs text-gray-400">
                                    <li>Заключите договор на НИОКР с аккредитованной организацией</li>
                                    <li>Убедитесь, что тематика входит в перечень Правительства РФ</li>
                                    <li>Оформите акт выполненных работ + отчёт о НИОКР</li>
                                    <li>Зарегистрируйте результаты в ЕГИСУ НИОКР</li>
                                    <li>Примените коэффициент ×2 к расходам в декларации</li>
                                </ol>
                            </div>
                        </div>
                    </div>

                    <!-- Grants -->
                    <div class="rounded-2xl border border-white/[0.06] bg-white/[0.02] p-5">
                        <div class="flex items-center gap-3 mb-4">
                            <div class="w-10 h-10 rounded-xl bg-blue-500/15 flex items-center justify-center"><i class="ph ph-hand-coins text-blue-400 text-xl"></i></div>
                            <div>
                                <div class="text-lg font-black">Гранты МИК</div>
                                <div class="text-[10px] text-gray-500">Московский инновационный кластер</div>
                            </div>
                        </div>
                        <div class="space-y-2 text-sm text-gray-300">
                            <p>Компенсация до <span class="text-blue-400 font-bold">50 млн ₽</span> затрат на НИОКР через программы МИК.</p>
                            <div class="grid grid-cols-2 gap-2 mt-3">
                                <div class="p-3 rounded-xl bg-white/5 border border-white/10 text-center">
                                    <div class="text-xl font-black text-blue-400">50%</div>
                                    <div class="text-[10px] text-gray-500">компенсация затрат</div>
                                </div>
                                <div class="p-3 rounded-xl bg-white/5 border border-white/10 text-center">
                                    <div class="text-xl font-black text-blue-400">90 дней</div>
                                    <div class="text-[10px] text-gray-500">срок рассмотрения</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Templates -->
                    <div class="rounded-2xl border border-white/[0.06] bg-white/[0.02] p-5">
                        <div class="flex items-center gap-3 mb-4">
                            <div class="w-10 h-10 rounded-xl bg-purple-500/15 flex items-center justify-center"><i class="ph ph-files text-purple-400 text-xl"></i></div>
                            <div>
                                <div class="text-lg font-black">Шаблоны документов</div>
                                <div class="text-[10px] text-gray-500">Готовые формы для оформления</div>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <div class="p-3 rounded-xl bg-white/5 border border-white/10 flex items-center justify-between hover:bg-white/10 transition cursor-pointer">
                                <div class="flex items-center gap-2"><i class="ph ph-file-doc text-purple-400"></i><span class="text-sm">Шаблон ТЗ на НИОКР</span></div>
                                <span class="text-[10px] text-gray-500">DOCX</span>
                            </div>
                            <div class="p-3 rounded-xl bg-white/5 border border-white/10 flex items-center justify-between hover:bg-white/10 transition cursor-pointer">
                                <div class="flex items-center gap-2"><i class="ph ph-file-doc text-purple-400"></i><span class="text-sm">Договор на выполнение НИОКР</span></div>
                                <span class="text-[10px] text-gray-500">DOCX</span>
                            </div>
                            <div class="p-3 rounded-xl bg-white/5 border border-white/10 flex items-center justify-between hover:bg-white/10 transition cursor-pointer">
                                <div class="flex items-center gap-2"><i class="ph ph-file-doc text-purple-400"></i><span class="text-sm">Акт выполненных работ</span></div>
                                <span class="text-[10px] text-gray-500">DOCX</span>
                            </div>
                        </div>
                    </div>

                    <!-- Tax support service link -->
                    <div class="rounded-2xl border border-red-500/20 bg-red-500/5 p-5">
                        <div class="flex items-center gap-3 mb-3">
                            <div class="w-10 h-10 rounded-xl bg-red-500/15 flex items-center justify-center"><i class="ph ph-shield-check text-red-400 text-xl"></i></div>
                            <div>
                                <div class="text-lg font-black">Подтверждение расходов</div>
                                <div class="text-[10px] text-gray-500">Сервис МОСНАУКА</div>
                            </div>
                        </div>
                        <p class="text-sm text-gray-400 mb-3">Платформа помогает собрать корректный документарный контур НИОКР и снизить риск отказа при подтверждении расходов.</p>
                        <div class="grid grid-cols-3 gap-2 mb-3">
                            <div class="p-2 rounded-lg bg-white/5 text-center"><div class="text-[10px] text-gray-500">Квалификация</div></div>
                            <div class="p-2 rounded-lg bg-white/5 text-center"><div class="text-[10px] text-gray-500">Матрица затрат</div></div>
                            <div class="p-2 rounded-lg bg-white/5 text-center"><div class="text-[10px] text-gray-500">Отчёт НИОКР</div></div>
                        </div>
                        <a href="tax-support.html" target="_blank" class="block text-center py-3 rounded-xl bg-red-500/10 border border-red-500/20 text-sm font-bold text-red-400 hover:bg-red-500/20 transition">Подробнее о сервисе →</a>
                    </div>
                </div>
            `;
        }

        // ── Render Profile ──
        function renderProfile() {
            document.getElementById('section-profile').innerHTML = `
                <div class="mb-6">
                    <div class="text-[10px] uppercase tracking-[0.2em] text-red-400 font-bold mb-2">Настройки</div>
                    <h2 class="text-2xl font-black italic tracking-tight">Профиль компании</h2>
                </div>
                <div class="rounded-2xl border border-white/[0.06] bg-white/[0.02] p-6 max-w-lg">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-[10px] uppercase tracking-widest text-gray-600 font-bold mb-1">Компания</label>
                            <div class="px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-sm">${_user?.company || '—'}</div>
                        </div>
                        <div>
                            <label class="block text-[10px] uppercase tracking-widest text-gray-600 font-bold mb-1">ИНН</label>
                            <div class="px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-sm">${_user?.inn || '—'}</div>
                        </div>
                        <div>
                            <label class="block text-[10px] uppercase tracking-widest text-gray-600 font-bold mb-1">Отрасль</label>
                            <div class="px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-sm">${_user?.industry || '—'}</div>
                        </div>
                        <div>
                            <label class="block text-[10px] uppercase tracking-widest text-gray-600 font-bold mb-1">Контакт</label>
                            <div class="px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-sm">${_user?.contact || '—'}</div>
                        </div>
                        <div>
                            <label class="block text-[10px] uppercase tracking-widest text-gray-600 font-bold mb-1">Телефон</label>
                            <div class="px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-sm">${_user?.phone || '—'}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // ── Render Sidebar ──
        let _activeSection = 'overview';
        const _navItems = [
            { id: 'overview',  icon: 'ph-squares-four',   label: 'Дашборд' },
            { id: 'searches',  icon: 'ph-magnifying-glass', label: 'Мои поиски' },
            { id: 'projects',  icon: 'ph-kanban',         label: 'Проекты' },
            { id: 'messages',  icon: 'ph-chat-circle',    label: 'Сообщения' },
            { id: 'guide',     icon: 'ph-book-open',      label: 'НИОКР-гид' },
            { id: 'profile',   icon: 'ph-user-circle',    label: 'Профиль' },
        ];

        function renderSidebar() {
            const items = _navItems.map(n => `
                <button onclick="switchSection('${n.id}')" id="nav-${n.id}"
                    class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition
                    ${n.id === _activeSection
                        ? 'bg-red-600/15 border border-red-500/20 text-red-400'
                        : 'text-gray-400 hover:text-white hover:bg-white/5 border border-transparent'}">
                    <i class="ph ${n.icon} text-lg"></i>
                    ${n.label}
                </button>
            `).join('');

            document.getElementById('dash-sidebar').innerHTML = `
                <div class="h-full border-r border-white/5 bg-black/30 px-3 py-6">
                    <div class="text-[9px] uppercase tracking-[0.2em] text-zinc-600 font-black mb-4 px-4">Навигация</div>
                    <div class="space-y-1">${items}</div>
                </div>
            `;
        }

        function switchSection(id) {
            _activeSection = id;
            document.querySelectorAll('.dash-section').forEach(el => el.classList.add('hidden'));
            const target = document.getElementById('section-' + id);
            if (target) target.classList.remove('hidden');
            // Update sidebar active
            _navItems.forEach(n => {
                const btn = document.getElementById('nav-' + n.id);
                if (!btn) return;
                if (n.id === id) {
                    btn.className = btn.className.replace(/text-gray-400 hover:text-white hover:bg-white\/5 border border-transparent/, 'bg-red-600/15 border border-red-500/20 text-red-400');
                } else {
                    btn.className = btn.className.replace(/bg-red-600\/15 border border-red-500\/20 text-red-400/, 'text-gray-400 hover:text-white hover:bg-white/5 border border-transparent');
                }
            });
            // Render section content on first visit
            const renderFn = 'render' + id.charAt(0).toUpperCase() + id.slice(1);
            if (typeof window[renderFn] === 'function') window[renderFn]();
        }

        function doLogout() {
            fetch('/api/logout', { method: 'POST' }).catch(() => {});
            localStorage.removeItem('mosnauka_user');
            window.location.href = 'login.html';
        }

        initDashboard();
    </script>
</body>
</html>
